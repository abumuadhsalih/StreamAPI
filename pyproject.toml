[project]
name = "stream-api"
version = "0.1.0"
description = "RealSense camera streaming and capture API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "opencv-python-headless>=4.13.0.92",
    # PyPI only has x86_64 wheel; on ARM64 (Jetson) install via Intel APT repo — see README
    "pyrealsense2>=2.57.7.10387 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
