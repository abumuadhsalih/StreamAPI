[project]
name = "stream-api"
version = "0.1.0"
description = "ZED 2i camera streaming and capture API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Linux-only because the BLE path is stubbed elsewhere: macOS/CoreBluetooth
    # addresses devices by an opaque per-host UUID and can never resolve a MAC.
    # The marker also keeps pyobjc off dev laptops. bleak is pure Python and
    # dbus-fast ships aarch64 wheels, so it installs on the Jetson without
    # compiling.
    "bleak>=3.0.2 ; sys_platform == 'linux'",
    # bleak's own D-Bus transport, so this pulls in nothing new. Declared
    # anyway because main.py calls org.bluez directly to clear a stale BLE
    # link — that is a use bleak makes no promise about keeping installed.
    "dbus-fast>=5.0.22 ; sys_platform == 'linux'",
    "fastapi[standard]>=0.136.0",
    "opencv-python-headless>=4.13.0.92",
    "psutil>=7.2.2",
    # The camera SDK (pyzed) is deliberately NOT listed: it is not on PyPI and
    # needs CUDA. The ZED SDK installer's get_python_api.py drops a wheel built
    # for the Jetson's CUDA/L4T/Python into whichever interpreter runs it — run
    # it with the venv active (see README). On non-Linux the camera is stubbed.
    "pyserial>=3.5",
]

[project.scripts]
stream-api = "stream_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_api"]
